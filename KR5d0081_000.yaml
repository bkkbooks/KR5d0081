body:
  text: 總目凡八十問問法問空問知問見問善問惡問賢問愚問生問死問貴問賤問高問下問樂問苦問清問濁問顯問隱問大問小問虛問實問間問忙問去問來問平問常問喜問憂問得問失問福問禍問捨問取問中問邊問著問離問人問我問辨問訥問損問益問長問短問巧問拙問毁問讚問忘問貪問道問俗問非問是問思問世問妙問微問方問圓問應問變問情問物問機問慮問親問踈問逺問近問行問住問唯問衆無為清靜長生真人至真語録問法來人詢其法者何也長生子答曰通其道而達真空則謂之法通其釋而達無生則謂之戒授於法者不能盡其萬愆也不能通其萬理也授於戒者不能盡其萬善也不能通其萬慧也道法通則達自然清淨無為也釋戒通則盡我人衆生壽者也經云道法自然道法非空而空也復詢空者何也答曰道住非空也愚者守其頑空也賢者守其真空也世之思其色空也道者忘其世空也人之愛其皆空也思之罪者非空也達者明其道空也通者了其性空也濁者死則沉空也清者生則升空也經云出生入死生之徒十有三死之徒十有三悟其空則知也復詢知者何也答曰知者知其人恩惠可見心望其報也知其天之道則損有餘而惠窘也知其人之道則損不足而奉富也知其有道者順天也知其無道者順人也順其天則人之生也順其人則人之死也順天則全其清善也順人則縱其濁惡也經云觀天之道執天之行盡矣知其慧之光異於常人所見也復詢見者何也答曰見者非肉眼所見也見者見其虛無也見其慧光也見其亘容也見其恍惚也見其寶珠也見其霞彩也見其玄微也見其沖明也見其魂清也見其𩲸靜也經云道之為物唯恍唯惚見其無物之象外應其常善也復詢善者何也答曰善者方圓曲直應物而順於人也不生萬惡則謂之真善也不著萬物則謂之清善也達理則不讀萬經則謂之通善也達妙則不窮萬化則謂之明善也不害萬形則謂之慈善也不厭萬濁則謂之應善也不非萬人則謂之德善也不求萬有則謂之道善也不起萬私則謂之公善也不忘萬慧則謂之常善也經云善者吾善之不善者吾亦善之德善至善者非惡也復詢惡者何也答曰惡者人之不肖也人不順其天則天不順於人也人若拋撒則天教飢歉也人不修其善福則天不教豐熟也人心縱於惡毒則天意降其風雹也人至死不戒於惡殺則再世定生於修羅也人造惡則天惡報也人無惡所害於物則物無惡所傷於人也經云毒蟲不螫猛獸不據玃鳥不搏弗惡真通則明其賢也復詢賢者何也答曰賢者大達之人也大智者如無其通也大慧者如無其知也大聰者如無其明也大辨者如無其説也應其智則真有其萬通也應其慧則真有其萬解也應其聰則真有其萬明也應其辨則真有其萬説也智通者世通也慧通者道通也聰通者理明也辨通者言清也經云不尚賢使民不爭世之賢隱者石藏其玉也道之賢隱者無物之真也賢者非其愚也復詢愚者何也答曰愚者古之達人要遠其世之夢幻外貌若愚也儒者顔回清貧而一簞一瓢釋者釋迦乞食而一飯七家道者純陽無為而鶉居鷇食返其朴則高者就於下也有者就於無也明者似於暗也言者若其訥也經云我獨若遺我愚人之心也哉外愚則內抱其道真生也復詢生者何也答曰生者抱道則真生也保命則福生也養氣則神生也通微則妙生也無妄則慧生也應物則德生也常善則救生也夏至則陰生也冬至則陽生也交通則物生也真生則閴也福生則明也神生則靈也妙生則清也慧生則通也德生則夷也救生則慈也陰生則升也陽生則降也物生則成也經云道生一一生二二生三三生萬物天地生萬物以和氣而成則生也以金氣而殺則死也復詢死者何也答曰死者物之形也萬物至其深秋則形死其根不死也萬形至其百年則身死其性不死也無情萬物可以深其根也有情萬形可以養其性也根無其水則苖死也性無其命則身死也根者性也性者根也神者性也性者神也五行之數盡則其形衰死陰陽之外則其神無死也經云深根固蒂長生久視之道死而無其死者真常貴也復詢貴者何也答曰貴者貴其德也天施恩不令下知謂之貴德也天施恩不擇愛者與謂之貴德也天施恩生成不為主謂之貴德也天施恩濟人不望報謂之貴德也人要同天意惠窘唯自知人要同天意惠心公若私人要同天意惠財如棄泥人要同天意惠食不記誰經云萬物莫不尊道而貴德貴者之德有餘惠於賤也復詢賤者何也答曰賤者薄其外也真貴其德則外賤於身也德如美玉則身似頑石也德上通其天身下謙於海其言然下則其身處上也內賤其真則外貴其偽也貴德則世之重賤身則安然存見寶則成大器朴散則現真形通天則明夷妙通海則衆善歸言下則敬信譛身上則物我增賤真則魂𩲸散貴偽則味其真經云故貴必以賤為本高必以下為基就於賤下則舉其高也復詢高者何也答曰天之道則抑其高也人之道則舉其高也大達之士則隱其高也榮耀之人則衒其高也天之道抑高則惠於窘也人之道舉高則損於窘也大達者隱高則化其賢也榮耀者衒高則惑其愚也經云高者抑之下者舉之天之所高覆於下也復詢下者何也答曰下者海下則清通歸順也心下則清善歸順也清順則深廣也善順則德廣也喻如所立屋者梁棟就其下則椽檩歸之喻如所待賔者主人就其下則外客歸之椽檩歸之則成功也外客歸之則成德也經云江海所以能為百谷王者以其善下之處下清順則極樂也復詢樂者何也答曰樂者樂道則處清下為樂也樂俗則戀歌酒以為樂也樂清下由無喜無憂也樂歌酒則有歡有愁也樂無為之道則無修無證也樂有為之相則有修有墮也樂真性則無形無盡也樂偽身則有生有死也經云是以天下樂推而不厭樂道則無其爭也失其道之樂則憂生於苦也復詢苦者何也答曰苦者苦於身心也世之迷者苦巳貪生則入於死路也苦心用機則性沉於罪地也道之悟者苦巳鍊形則如碎石取玉也苦志忘機則性升於九霄也賢者苦中樂也愚者樂中苦也賢者苦盡而甘來愚者則樂極而哀也經云恩生於害害生於恩樂道而苦盡則通其清也復詢清者何也答曰清者天清則顯其萬象也心清則顯其亘靈也淵清則明其二八也通其天象則降氣沖和也通其亘靈則與道同體也通其淵清則靈泉無漏也得其沖和則氣神相結也得其同體則真形不朽也得其無漏則皓月光圓也經云淵兮似萬物之宗深通其清則無於濁也復詢濁者何也答曰濁者世之迷者縱於意則惡濁也縱於身則淫濁也縱於惡則昏其性也縱於淫則喪其命也道之悟者天清而混於地濁身清而混於世濁清混濁則陰變陽清混世則外若愚也經云孰能濁以澄淨之徐清濁盡則光顯也復詢顯者何也答曰顯者天之象非自見其明也天下衆目見其明也道之理非自是顯彰也天下衆善知其達也衆目見其明則敬也衆善知其達則信也世之敬其天地則福生也道之信其無為則真生也經云不自見故明不自是故彰內光顯則外身而隱也復詢隱者何也答曰隱者內慈救生外恐其人知也內真明達外貌若愚夫也內無罣礙外形似混塵也內光應物外無所施為也內性闡德外逺於人欽也內靈抱道外無所著迷也至明泯慮身寄於塵寰也經云道隱無名者名其大也復詢大者何也答曰大者道也陰陽而不能包謂之道大也大者性也萬邪而正能容則謂之性大也道之大者乃萬物之母也性之大者乃萬邪之師也通其母則萬物得其造化也通其師則萬邪歸其正達也造化則各成其形也正達則各通其道也經云道可道非常道大者容其小也復詢小者何也答曰小者通其微也道通其小則不擇其愛者與恩也性通其小則不擇其愛者與教也不擇其愛者與恩則小物皆受其道之氣也不擇其愛者與教則小物皆受其天之光也無情之小物得其道之氣則形生也有清之小物得其天之光則性生也經云治大國若烹小鮮不揀其愛者要不擇其弱者棄也小者之妙非虛也復詢虛者何也答曰虛者道之體也陰陽明其虛則萬物生也至性明其虛則恍惚生也萬物生成則濟於世也恍惚生成則出於世也物濟於人則世之樂也道通其真則性之樂也世樂則陰陽之有其數也性樂則虛極之無其窮也經云致虛極守靜篤萬物並作虛者道之實也復詢實者何也答曰實者道也道生在於天地之先至今常存不朽者謂之實也實者性也性生在於萬物之外至今常存不朽者謂之實也道明其實則掌握陰陽生於萬物也性明其實則大達樞要通於萬化也萬物生則顯其道之實也萬化生則顯其性之實也道虛而氣實也性虛而命實也經云虛其心實其復明其實則道性真間也復詢間者何也答曰間者道也至道間則間運陰陽而生於物也至性間則間烹鉛汞而鍊其形也陰陽變則全其物也鉛汞成則全其性也全其物則人之富也全其性則神之靈也人富則欲其華也神靈則抱其道也欲華則有榮有枯也抱道則無形無盡也經云視之不足見聽之不足聞性樂真間則應其忙也復詢忙者何也答曰忙者道乃間也二氣而常忙也性乃間也四假而常忙也二氣忙則四時而分為上下也四假忙則晝夜而貪爭往來也二氣忙則春變溫夏變暑秋變涼冬變寒也四假忙則貪於財戀於色迷於酒競於氣也二氣忙則造化萬物乃陰陽順其天地之德也四假忙則造於萬業乃衆生違其天地之德也經云音聲之相和前後之相隨形忙悟者真無去也復詢去者何也答曰去者道乃常存而無其盡也道象無所去也去者物乃成形而有其盡也氣有所去也道者通其陰陽也氣者通其萬物也數盡則陰陽而散去也形終則萬物而朽去也陰陽散而道常在也萬物朽而性常存也經云自古及今其名不去物盡而氣去也陽和而氣來也復詢來者何也答曰來者非其形而動也天地待其時而交通則二氣來也萬形待其時而受氣則陰陽來也道乃天地之位也形乃陰陽之位也天地在其道久位也陰陽在其物寄位也久位而四時變通也寄位而三才聚會也變通則成造化也聚會則成真形也枯則物死也柔則形生也經云人之生也柔弱其死也堅強柔來則通其天之清平也復詢平者何也答曰平者道也道養其萬物則不擇其愛者與恩布氣而平也平者真也真通其萬化則不擇其愛者與妙布德而平也氣平則物齊生也德平則人齊善也物齊生則皆全其造化也人齊善則皆全其道德也經云天地相合以降甘露人莫之令而自均妙明其常也復詢常者何也答曰常者道也常順其道則救於人靈也常順其氣則救於物形也人常順其道則如魚在水也物常順其氣則如燈添油也魚離其水則死也燈盡其油則滅也常順其道則人生也常順其氣則物生也人者神也物者形也形神俱妙則與道合其真也經云常善救人故無棄人樂其道之常則真喜也復詢喜者何也答曰喜者道樂也清而無濁則道樂也喜而無憂則道樂也喜者德樂也勸惡從其善則德樂也見讎而酬其恩則德樂也喜者失樂也逺善而喜於惡則失樂也忘恩而報於讎則失樂也樂其道則全其功也樂其德則全其行也樂於失則輪回墮也經云道者同於道德者同於德失者同於失樂喜則忘於憂也復詢憂者何也答曰有憂者不達其道之正理也多事則多憂也無憂者真通其道之真慧也無事則無憂也多事有於憂則神昏氣濁也無事無於憂則神清氣爽也氣濁則有思淫惡也喪其魂𩲸也氣清則無慮清善聚其鉛汞也魂𩲸散而性下沉也鉛汞成而性上升也經云絶學無憂無於憂念其道則真有實得也復詢得者何也答曰得者真得則得其無名之清寵偽得則得其有名之濁辱也得清寵者無貪爭也得濁辱者有貪爭也無貪爭則真通其善道也有貪爭則偽迷其惡俗也真全其萬行則上寵也偽造其萬業則下辱也悟則無生也迷則有墮也經云寵辱若驚得其偽名著則真道失也復詢失者何也答曰失者失其無為之道也失者著於有為之道也失者失其無為之德也失者著於有為之德也達其無為之道則真無盡也著其有為之道則偽有盡也達其無為之德則性常平也著於有為之德則心有憎也無為之道無盡則真無壞也有為之道有盡則偽有壤也無為之德真平則通天也有為之德偽憎則即墮也經云故失道而後德失德而後仁達無為則無失通其清福也復詢福者何也答曰福者真福乃道也人之命也世福乃塵也物之寶也無為之道福者如皓月常盈也有為之世福者如缺月漸虧也皓月盈而人之命也缺月虧而世之寶也命者無盡之道福也寶者有盡之世空也悟其道則福生也迷於世則業沉也經云福兮禍所伏孰知其極達其道之福則無於禍也復詢禍者何也答曰禍者人之欲也預造於愆也人若業有一分天降於十分禍也人若善有一分則天賜於十分福也經云絶利一源用師十倍人若不生於萬惡則勝修於萬善也人若不著於萬物則勝施其萬惠也經云三返晝夜用師萬倍達其無為則清福有其萬倍也迷其有為則偽福匿於禍也經云禍兮福所倚真者非外捨也復詢捨者何也答曰捨者世之捨於財則望其福也捨者道非捨於有而取其無也捨財取其福則不通其真福也捨有著於無則不通其真無也真福者萬慈也真無者萬達也慈則救於物也達則明其理也慈廣則德遍也理闡則道明也經云今捨其慈且勇捨其儉且廣進其道非取也復詢取者何也答曰取者妄而非正也至真者道也通清者德也盡於物而達則道歸之處其下而深則德歸之真不著於有則物歸之海不處於上則清歸之物歸之全其造化也清歸之全其至德也人若悟於世偽則達其虛無而有功也人若悟於盡我則通其謙下而有行也經云居其實不居其華故去彼取此真無所取則明其中也復詢中者何也答曰中者天之平也天施恩而生萬物者不揀擇則謂之明其中也人之平者真布德而通萬化者不憎愛則謂之明其中也天平而萬物生成則天有其功也人平而萬化真通則人有其行也天若愛者與恩則無其大功也人若愛者施惠則無其大行也經云夷道若類明其夷道則清福無邊也復詢邊者何也答曰邊者不通其理也見於有而不通其無也見其無而不通於有也謂之邊見不著於邊見則通其理也見其有而通於無也見其無而通於有也通於有則抱道而隱於洞天也達於無則抱道而隱其京華也經云為無為事無事不立於二邊則真無著也復詢著者何也答曰著不著則同塵而身混於萬物之有也真無著其萬有之心則謂之大達也不著著則出塵而身逺於萬物之有也真有著其萬物之念則謂之未達也著不著則身似於藕也不著著則身若蓮也身在於塵性無於塵則了真也身逺於塵心有於塵則未了也經云弊則新真了則身應於物非著非離也復詢離者何也答曰離者身離於欲心忘其塵則寂然守其志也離者身隱於名山真應其琴書寂然樂通志也守其志則淳朴也樂通志則華達也身淳朴而心華達謂之偽形神而俱妙也形朴散而真華達則謂之真形神俱妙也經云不見可欲使心不亂清脫離於物殼則通人也復詢人者何也答曰人者人之生縱其惡則死沉於惡道輪轉也謂之天所治於人也人之生不修其福則死沉貧賤輪轉也謂之天所治於人也人之有所善則生在於中華修其道也人之有其洪禧則生在於中國積其德也人有於惡則天乃惡報也人有其善則天乃善報也經云治人事天莫若嗇人之不通其天意所執於我也復詢我者何也答曰我者真我者人之性也我道無形之道也我善無為之善也人皆謂不肖也偽我者人之惡也偽道養身之道也偽善有為之善也人皆謂見肖也真我者無形之道則真也無為之善則常也偽我則養身之道則假也有為之善則憎也經云天下皆謂我道大似不肖若肖久矣明其真我不辨也復詢辨者何也答曰辨者世之有辨者有於萬惡也天之不言者有其萬善也世之辨則有於是非也道之辨則有其清善也世之口有辨而心無達也道乃口無説而真有通也無達則廣博而無知其妙也有通則絶學而有知其妙也兩者謂之迷悟也經云善者不辨辨者不善通其天意則外若訥也復詢訥者何也答曰訥者似於訥者似其不能言也達其道而散於朴則訥者如辨也抱其道而返於朴則辨者如訥也散其朴則損氣而身有於拘也返其朴則惜氣而身無於拘也見其愚者辨如訥也見其賢者訥如辨也經云大巧若拙大辨若訥益真則外損之復詢損者何也答曰損者有道之人用事則損於巳不損其他人也若處先已而後人則有其德也無道之者用事則損其他人不損於已若處先人而後已則無其德也有其德者無為也無其德者有為也無其為損於物則有道也有其為殢於物則無道也經云為道日損外損盡於物則道所益也復詢益者何也答曰益者有益其真者道之理也悟道則所學其正教有達者益真也迷世則所學於邪法無達者益身也益真則明其道也益身則殢於物也明道則清善也殢物則貪爭也清善則積其德也貪爭則積於業也有其萬行則真升也有其萬業則身墮也經云為學日益所學益其道之真則久長也復詢長者何也答曰長者人之長則順其道而真長也忘於情則命長也善明妙則天長也通其慧則理長也真長則達虛無體也命長則寶光圓也天長則祥煙裊也理長則自然通也明虛無則道全也明光圓則命全也明祥煙則神全也明自然則德全也經云天長地久順其天之長則無於短也復詢短者何也答曰短者守道無終則志短也見善無慈則行短也二尊不敬則孝短也志短則無功也無慈則無行也無孝則忘恩也有志則全道也有慈則全德也酬恩則全孝也無道無德無孝則有短也有道有德有孝則無短也經云斯不善已智短則生於偽巧也復詢巧者何也答曰巧者殢其萬巧有為明萬利而利多則害身也絶其萬巧無為明萬清而清多則全身也世利多則生於禍也道清多則生於福也偽巧則生於禍也真清則生於福也迷於有則偽也悟其無則真也偽有則惡所害也真無則善所侵也經云絶巧棄利盜賊無有明者忘於偽巧而守其真拙也復詢拙者何也答曰拙者至性而通賢外貌似其愚拙則謂之返朴也真慧而通文偽形而憨拙則謂之伏藏也對其偽迷隱則拙明也對其真悟顯則拙達也通於世則物達也通於道則真達也見其俗士則應於萬有而機變自然通有也見其知音則應於萬無而機變自然通無也外拙而真非愚也經云性有巧拙可以伏藏至巧而若拙則明者譛也復詢譛者何也答曰譛者君子則揚人美而掩人醜也小人則掩人美而揚人醜也掩人之醜惡揚人之美善則謂之德也揚人之醜惡掩人之美善則謂之愆也有其德則再為人貴也有於愆則再為人賤也今世重人者來世人却重也今世輕人者來世人却輕也德全其道則升也愆迷於世則墮也經云知者不言言者不知善譛則無於惡毁也復詢毁者何也答曰毁者有毁者愚不知賢也無毁者賢知其愚也愚者舉惡而抑其善也賢者勸惡而歸其善也愚者生愆而著其相求福也賢者泯愆而忘其相守道也迷者有惡而有善也悟者無惡而無善也有善者無常也無惡者有常也有常則謂之道也經云愚人以天地文理聖我以時物文理哲無於毁則濁念忘也復詢忘者何也答曰忘者念其道則忘於世也念其正則忘於邪也謂之迷悟也念道則修其真也念世則養於身也念正則通至理也念邪則修色身也念真則有其功無愆也養身則無其功有愆也念其正則有行也無著也念其邪則有著也無行也經云心生於物死於物達理明其樞機則真忘念也外無貪也復詢貪者何也答曰貪者貪於欲則喪其命也貪於財則喪其身也迷者先甘而後苦也泯於欲則全其命也絶於財則全其身也悟者先苦而後甘也喪命喪身則愚也全命全身則賢也濁者貪世違其道也清者忘世達其道也經云罪莫大於可欲禍莫大於不知足不貪世偽則真抱道也復詢道者何也答曰道者通物無物則道也知空而不空則常也謂之道常也道常達則無為通也無者明恍惚之妙也為者明變通之理也無則陰陽之外也為則萬化之明也達無而明其有也通為而明其無也非殢於有相為也經云道常無為而無不為道之為非小善化於俗也復詢俗者何也答曰俗者人之俗軀也真者至神也謂之有物也有之外道乃天地之先也物之表性乃陰陽之外也有而明則如石中見其玉也物而明則似蚌中見其珠也有者人之形也物者真之性也形終則性常在也物盡則氣常存也迷有物則魂𩲸散也悟道性則造化成也經云有物混成先天地生外應俗而無於非也復詢非者何也答曰非者上士之人暗行其萬清萬善而大通也下士之人明縱於萬濁萬惡而大笑也清者順道而存也濁者逆道而亡也賢者外不賢也愚者外不愚也清濁賢愚久而世知之矣日月之明非自見其明也天下衆目見其明也經云下士聞道大笑之非其是也復詢是者何也答曰是者從其道則真是也非者從於物則偽非也明真則不著於偽也明是則不言於非也明於真則妙通其道也明於是則妙通其天也明道則有其功也明天則有其行也功者陽道也行者陰德也若私救於萬形謂之陽功也若偷救於萬苦謂之陰德也經云自見者不明自是者不彰自是念道而應物則有其思也復詢思者何也答曰悟思者有知其萬清而行則有萬善也知於萬愛而行則有萬惡也有萬清萬善則真升也有萬愛萬惡則偽墮也生無愆則死無苦也生有愆則死有苦也經云吾言甚易知甚易行天下莫能知莫能行思而知其理之妙忘於世也復詢世者何也答曰世者通世有知於人則忘世而向道也迷世無知其人則戀世而背道也真通其萬物則出於萬物之殼也偽迷其萬物則在於萬物之殼也真出於物殼則道也偽在於物殼則塵也真在其道則無生死也偽在於塵則有生死也悟則智通迷則不明也經云知人者智物極而世外則明其奧妙也復詢妙者何也答曰妙者真無欲則性如皓月圓而觀其妙也偽有欲則妄似螢耀明而見於徼也皓月則十方明也螢耀則一點明也十方明則通萬化也一點明則執一法也通化容於邪也執法謗其正也無高下通則正也有憎愛執則邪也經云常無欲以觀其妙常有欲以觀其徼達妙則明其微也復詢微者何也答曰微者見其深微則明道也明其深慮則通世也通道者預通世也通世者不通道也明道則提通世者通世則敬通道者通道行道則達也通世忘世則賢也達者化世之賢也賢者化世之愚也愚者明則賢也賢者明則逹也經云微妙玄通深不可識悟幽微則明無方也復詢方者何也答曰方者天地方圓生於萬物也不以愛者恩生也不以憎者害滅也太上布德救於萬靈不以貴者愛戀也不以賤者斷絶也天地生於萬物布氣而平也太上救於萬靈布德而平也萬物氣通則通天地之大恩功也萬靈德通則通太上之大恩行也謂之天地聖人若私至功至行也經云是以聖人方而不割真明其方寸則命光圓也復詢圓者何也答曰圓者天之圓光望日則月圓也晦日則光盡也人之命光十五則連受胎十六歲命圓也八八而卦盡也光盡則天無明也卦盡則人無命也少欲則命延也多欲則壽夭也謂之天之人之盈虧也無情則命住也無物則性通也命通性則如水見土也性通命則如土見水也常善通則真火降也九轉成則形不朽也經云見小曰明圓光顯則應也復詢應者何也答曰無形之道不應有形之身也無形之性不應有情之禮也貴實者仙道則道應其性也貴華者人道則形應於禮也應其性則真也應於禮則偽也天之道抑高而舉下也人之道損貧而奉富也順其天道則逆於人道也順於人道則逆其天道也經云上禮為之而莫之應道應其無為則真通變也復詢變者何也答曰變者無為真變則如水中鑑月也有為偽變則似鏡裏觀形也知無為之變則真性通也見有為之變則偽形力也通則無情之真忘有清之偽也力則有情之偽昧無情之真也真變則性通道也偽變則身貪利也道通則全其性也利貪則害於身也經云為無為則無不治矣應其真變則道無情也復詢情者何也答曰情者曲則道性無情而身似有其情也執則道性有情而身如無情也曲性無於情則無漏也執性有於情則有漏也曲則賢也執則愚也無漏而有賢則有道有德也有漏而無賢則無道無德也有道之真則魂𩲸全也有德之明則萬化通也經云我無欲而民自朴我無情而民自清道無情則真不著於世物也復詢物者何也答曰物者人在於物殼則似魚在網也人出其物殼則如真在道也魚在網離水則死也真在道離物則生也魚不餌則魚常在水也人不貪物則人常在道也魚在水則活也人在道則生也魚得珠光則變也人得氣沖則通也此兩者迷則死也悟則生也經云天網恢恢踈而不失物外則忘於機也復詢機者何也答曰機者智也無道之人用智則損於人安其自巳謂之賊也有道之人用智則損其自巳安於人謂之福也小智則愚惡也大智則賢善也愚者違天也賢者順天也違天則身墮也順天則真升也墮者陰道濁也升者陽道清也經云民之難治以其智多自然之智明道則無慮也復詢慮者何也答曰迷世則有心也悟道則無慮也貪爭者運萬慮也清善則絶萬慮也昧則罪無邊也明則福無邊也無善則常惡也無惡則常善也常惡者積愆也常善者積德也有愆則陰苦也有德則陽樂也世之知利而不知害也道乃知福而不知貪也經云知不知上不知知病絶慮而盡於物則至道親也復詢親者何也答曰親者人間所親者名利親也偽寶親也物外所親者道德親也真寶親也偽親者有名利則有寵辱也有偽寶則有惡人所妨也真親者有道德則清平也有真寶則有善人所侵也偽益於身則損其真也真益其身則損於偽也經云名與身孰親身與貨孰多道親則物踈也復詢踈者何也答曰踈者厭世則道無踈也厭利則身無害也厭貴則身無賤也道無踈則通世也身無害則通利也身無賤則通貴也通世則善歸也通利則福歸也通貴則德歸也常善則通靈也真福則通命也至德則通天也經云故不可得而親不可得而踈不踈其道之真則明其久逺也復詢遠者何也答曰逺者道包久逺天高覆逺地載物逺王大清逺道則明萬古也天則明萬象也地則生萬物也王則安萬民也道無所不包也天無所不蓋也地無所不載也王無所不容也道包則大也天蓋則大也地載則大也王容則大也經云大曰逝逝曰逺道非逺真洽道則近也復詢近者何也答曰近者近有道之身觀無道之身近有道之家觀無道之家近有道之鄉觀無道之鄉近有道之國觀無道之國近有道之天下觀無道之天下身孝則報父母之恩也家善則如許君龐士也鄉行則憐貧愛老也國清則萬民豐足也天下有道則天下成熟也經云故以身觀身明道則真能行也復詢行者何也答曰行者太上所行天之道也天地不言而暗施其恩生於萬物也太上不言而暗施其德行於萬善也天地不言而恩善應也太上不言而教善通也萬物成則民富也萬化明則真通也民富則國太平也真通則樂無事也民富則各士農工商也真通則闡太上無為也經云行不言之教道無所行德無所住也復詢住者何也答曰住者居也真無情而形在道也偽有情而身寄世也真形則與道交也偽身則應物交也真忘形則道也身應世則德也心有情則迷也身逺世則執也有道德則無迷執也無道德則有迷執也真有道有德則有賢有善也偽無道無德則有愚有惡也經云安其居樂其俗永住太無則唯然也復詢唯者何也答曰唯者唯然三界道顯無拘也飄然四海真隱無侣也道無拘則陰陽外也真無侣則碧霄中也道體非空非色也真光不虧不盈也達無則出於萬物之殼也通為則闡其萬慧之明也天大恩若無恩也積大德若無德謂之明其天之道也經云夫唯不居是以不去唯樂道而應機則哀衆也復詢衆者何也答曰衆者衆所明者愛名愛利愛是愛非也我所昏者忘名忘利忘是忘非也衆愛名則有辱也我忘名則無辱也衆愛利則有害也我忘利則無害也衆愛是則有非也我忘是則無非也衆愛非則有愆也我忘非則無愆也經云衆人昭昭我獨若昏無為清靜長生真人至真語録
