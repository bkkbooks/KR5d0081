front:
  text: 無為清靜長生真人至真語録序畢三我聞道在域中所宜馴致仙居象外不可苟求故樂天詩云若非金骨相不列丹臺名非種百千劫善根得三五一真之氣安能至此境哉今長生子劉先生賦是相藉是名昔遇重陽王真人濟度點化出俗入道明識慧性了達踈通昨被宣詔見有詩曰昔年陜右先皇詔今日東萊聖帝宣再歲告歸官僚索詞云飄飄雲水却東萊太微仙伴星冠士正似陳希夷昔承宋眷辭返華山詔答云玉堂金闕暫喜於來朝岫幌雲軿遽求於歸隱此二大士之不羈各一明朝之擅美蓋營道同耳易地則然自先生躬還故里觀住太微箋注諸經祖述三聖以文章踈放以翰墨嬉遊著編籍演教法遵釋氏重輕之戒造玄皇衆妙之門服宣父五常之行緝田宅發梨棗申申如也凡有述作競雕鏤以流傳新視聽於衆庶諷誦於人口薰陶乎民風知見者歸依頑鄙者悛改一日先生門人徐李二師逺來垂訪過溪館入愚齋息杖履之勞餽水陸之味良久出示先生至真語録一帙懇求序引義不復辭余乃洗心遍覽令人警誡覺悟頓欲割俗緣出業障邪始終列八十欵問答踰一萬言包羅揆敘引證論評根天地之化迹陰陽之用示死生之説明禍福之報談真空之相懲貪瞋之欲以至苦樂之由情偽之作清濁之源高下之本若此者甚衆無不究竟皆引用黃老奧義斷之天下之事畢矣可使衆生判疑歸正涣然冰釋為鑿大昏之墉闢靈照之户一驅解脫矣於是得超苦海登覺岸除三有五濁之穢證三昧一空之因去十二類舊染之污受三千界更生之樂信出自真語啓迪導化法緣所致也豈不偉歟峕泰和壬戌歲上元日濩澤端城變溪虛白道人韓士倩顔廣謹序
